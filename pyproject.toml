[project]
name = "ingestion"
version = "0.1.0"
description = "Ingestion service: FastAPI front-end -> multiprocessing queue -> spaCy NER workers -> savers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "spacy>=3.8,<3.9",
  "en-core-web-sm",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
firestore = ["google-cloud-firestore>=2.16"]

[project.scripts]
ingestiond = "ingest.backend:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["ingest", "tests"]
python_files = ["*_test.py", "test_*.py"]
